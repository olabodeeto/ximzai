[project]
name = "ximz"
version = "0.1.0"
description = "Fully local, always-on voice assistant for macOS"
requires-python = ">=3.11,<3.13"
dependencies = [
    "kokoro-onnx>=0.6.1",
    "mlx-whisper>=0.4",
    "numpy>=1.26",
    "ollama>=0.4",
    "pyobjc-framework-Cocoa>=10.0",
    "pyobjc-framework-Quartz>=10.0",
    "pyyaml>=6.0",
    "silero-vad>=5.1",
    "sounddevice>=0.4.6",
    "soundfile>=0.12",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ximz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
